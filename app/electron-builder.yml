npmRebuild: false
appId: com.achmage.yogurt
productName: Achmage Yogurt
copyright: Copyright © 2026 Frigade
publish:
  provider: github
  owner: laguna821
  repo: achmage-yogurt
  releaseType: draft
extraMetadata:
  name: achmage-yogurt
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/mcp-relay.mjs
    to: tools/achmage-mcp.mjs
  - from: resources/bin
    to: bin
  - from: resources/vad
    to: vad
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray@2x.png
    to: tray@2x.png
  - from: resources/licenses
    to: licenses
  - from: resources/about/Credits.html
    to: Credits.html
  - from: resources/achmage-transcript
    to: achmage-transcript
  - from: resources/tools
    to: tools
  - from: resources/python
    to: python
  - from: resources/pdf
    to: pdf
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
afterPack: scripts/linux-launcher.cjs
asarUnpack:
  - '**/node_modules/node-llama-cpp/**'
  - '**/node_modules/@node-llama-cpp/**'
mac:
  files:
    - out/**
    - package.json
    - '!**/node_modules/@node-llama-cpp/{linux,win,mac-x64}*/**'
    - '!**/node_modules/node-llama-cpp/bins/{linux,win,mac-x64}*/**'
    - '!**/node_modules/node-llama-cpp/**'
    - '!**/node_modules/@node-llama-cpp/**'
  artifactName: Achmage-Yogurt-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  minimumSystemVersion: '14.4'
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    LSUIElement: false
    NSMicrophoneUsageDescription: >-
      Achmage Yogurt records your voice in meetings so it can write the transcript and your notes. Transcription runs locally.
      Selected online AI and source connections process material only when requested.
    NSAudioCaptureUsageDescription: >-
      Achmage Yogurt records the sound of your calls so it can write down what others say. Transcription runs locally. Selected
      online AI and source connections process material only when requested.
    NSCalendarsFullAccessUsageDescription: >-
      Achmage Yogurt reads your calendar to name your notes after the meeting and to know who is in it. Transcription runs
      locally. Selected online AI and source connections process material only when requested.
    NSCalendarsUsageDescription: >-
      Achmage Yogurt reads your calendar to name your notes after the meeting and to know who is in it. Transcription runs
      locally. Selected online AI and source connections process material only when requested.
    NSAppleEventsUsageDescription: Achmage Yogurt checks the browser tab's name to tell when you're in a call, and pauses your music while it records.
    NSCameraUsageDescription: Achmage Yogurt doesn't use the camera.
    NSBluetoothAlwaysUsageDescription: Achmage Yogurt doesn't use Bluetooth.
    NSBluetoothPeripheralUsageDescription: Achmage Yogurt doesn't use Bluetooth.
  identity: null
  notarize: false
win:
  files:
    - out/**
    - package.json
    - '!**/node_modules/@node-llama-cpp/{linux,mac,win-arm64}*/**'
    - '!**/node_modules/node-llama-cpp/bins/{linux,mac,win-arm64}*/**'
    - '!**/node_modules/node-llama-cpp/**'
    - '!**/node_modules/@node-llama-cpp/**'
  extraResources:
    - from: resources/dict
      to: dict
    - from: resources/speed
      to: speed
    - from: resources
      to: .
      filter:
        - tray-color*.png
        - tray-recording*.png
  artifactName: Achmage-Yogurt-windows-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  signExecutable: false
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
linux:
  files:
    - out/**
    - package.json
    - '!**/node_modules/@node-llama-cpp/{mac,win,linux-arm,linux-riscv}*/**'
    - '!**/node_modules/node-llama-cpp/bins/{mac,win,linux-arm,linux-riscv}*/**'
    - '!**/node_modules/node-llama-cpp/**'
    - '!**/node_modules/@node-llama-cpp/**'
  executableName: achmage-yogurt
  extraResources:
    - from: resources/dict
      to: dict
    - from: resources/speed
      to: speed
    - from: resources
      to: .
      filter:
        - tray-color*.png
        - tray-recording*.png
  artifactName: Achmage-Yogurt-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
  syncDesktopName: true
  icon: build/icons
  category: Office
dmg:
  title: Achmage Yogurt
  background: build/background.png
  iconSize: 128
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      'y': 170
    - x: 480
      'y': 170
      type: link
      path: /Applications
  sign: false
